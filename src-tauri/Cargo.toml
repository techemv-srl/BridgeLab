[package]
name = "bridgelab"
version = "2.0.0"
edition = "2021"
description = "BridgeLab - HL7 made simple"
authors = ["TECHEMV SRL <info@techemv.it>"]

[[bin]]
name = "bridgelab"
path = "src/main.rs"
required-features = ["desktop"]

[lib]
name = "bridgelab_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
# Official TECHEMV builds ship with "pro" enabled. Building with
# --no-default-features --features desktop compiles without the
# BUSL-licensed src/pro/ directory (the SOAP client); it is not a
# Community-only binary: the licence check still unlocks the other paid
# features, which are MIT code;
# --no-default-features alone builds the headless core library that
# bridgelab-cli is built on (the binary needs `desktop`, see [[bin]]).
default = ["pro", "desktop"]
pro = []
# Everything that needs a window: the IPC commands, the MLLP listener,
# telemetry and online activation. Off, the crate is the headless core
# that bridgelab-cli is built on.
desktop = [
    "dep:tauri",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-fs",
    "dep:tauri-plugin-updater",
    "dep:tauri-plugin-single-instance",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-process",
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The desktop shell. Optional so that bridgelab-cli can depend on this
# crate's parsers and validators without compiling Tauri, GTK or WebKit.
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-fs = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
memchr = "2"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "6"
# rustls with both root sets: the bundled Mozilla roots, and the operating
# system's store, so a company's own CA (a TLS-inspecting proxy) is trusted
# for activation, renewal, telemetry and the HTTP tool as it is by the OS.
reqwest = { version = "0.12", features = ["json", "rustls-tls", "rustls-tls-native-roots"], default-features = false }
chrono = { version = "0.4", features = ["serde"] }
hostname = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
# The pre-1.9 hardware ID, frozen (std's DefaultHasher may change).
siphasher = "1"
rand = "0.9"
regex = "1"
encoding_rs = "0.8"
quick-xml = "0.41"
flate2 = "1"
tar = "0.4"

# Hand freed memory back to the OS after messages are released (glibc keeps
# it otherwise, and a closed 5 MB message stayed in the process size).
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"

# MachineGuid for the hardware ID, through the registry API (reg.exe can be
# blocked by policy).
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
