[package]
name = "bridgelab"
version = "1.7.0"
edition = "2021"
description = "BridgeLab - HL7 made simple"
authors = ["1warpengine"]

[[bin]]
name = "bridgelab"
path = "src/main.rs"
required-features = ["desktop"]

[lib]
name = "bridgelab_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
# Official TECHEMV builds ship with "pro" enabled. Building with
# --no-default-features --features desktop produces a Community-only
# binary that compiles without the BUSL-licensed src/pro/ directory;
# --no-default-features alone builds the headless core library that
# bridgelab-cli is built on (the binary needs `desktop`, see [[bin]]).
default = ["pro", "desktop"]
pro = []
# Everything that needs a window: the IPC commands, the MLLP listener,
# telemetry and online activation. Off, the crate is the headless core
# that bridgelab-cli is built on.
desktop = [
    "dep:tauri",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-fs",
    "dep:tauri-plugin-updater",
    "dep:tauri-plugin-single-instance",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-process",
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The desktop shell. Optional so that bridgelab-cli can depend on this
# crate's parsers and validators without compiling Tauri, GTK or WebKit.
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-fs = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
memchr = "2"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "6"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
chrono = { version = "0.4", features = ["serde"] }
hostname = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
rand = "0.9"
regex = "1"
encoding_rs = "0.8"
quick-xml = "0.41"
flate2 = "1"
tar = "0.4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
