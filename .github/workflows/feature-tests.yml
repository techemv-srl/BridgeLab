name: Feature Tests

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

# Runner: GitHub-hosted by default. A repository that sets the Actions
# variable CI_RUNNER (Settings → Secrets and variables → Actions →
# Variables) runs these jobs there instead — the private repo points it at
# its self-hosted runner, e.g. ["self-hosted","linux","x64"], so CI does not
# consume hosted minutes. The public mirror leaves it unset: self-hosted
# runners must never execute jobs a public repository's pull requests can
# trigger.
jobs:
  cli-feature-tests:
    name: CLI Feature Tests
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install test utilities (xmllint, jq)
        run: |
          # Already installed (a self-hosted runner prepared once) → no sudo needed.
          PKGS="libxml2-utils jq"
          # dpkg -s also succeeds for removed-but-not-purged packages, so
          # require the exact status of an installed package for each one.
          missing=0
          for p in $PKGS; do
            dpkg-query -W -f='${Status}' "$p" 2>/dev/null | grep -qx 'install ok installed' || missing=1
          done
          if [ "$missing" = 0 ]; then
            echo "System packages already installed: $PKGS"
          else
            sudo apt-get update
            sudo apt-get install -y $PKGS
          fi

      - name: Cache cargo
        if: ${{ vars.CI_RUNNER == '' }}
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/bridgelab-cli/target
          key: ${{ runner.os }}-cli-${{ hashFiles('tools/bridgelab-cli/Cargo.lock') }}

      # Self-hosted runner (CI_RUNNER set): no cache round-trip to GitHub —
      # the upload over the office line costs more than it saves. Build
      # output lives on the runner's own disk, outside the work folder so
      # checkout does not wipe it; ~/.cargo already persists there. One
      # directory per workspace: jobs building the same crate reuse it, and
      # cargo's lock serialises concurrent runner instances safely.
      - name: Keep build output on the runner's disk (self-hosted)
        if: ${{ vars.CI_RUNNER != '' }}
        run: echo "CARGO_TARGET_DIR=$HOME/.cache/bridgelab-ci/bridgelab-cli" >> "$GITHUB_ENV"

      - name: Build CLI
        working-directory: tools/bridgelab-cli
        run: |
          cargo build --release
          # The test steps call ./tools/bridgelab-cli/target/release/bridgelab-cli;
          # with the build output elsewhere (self-hosted), link it there.
          if [ -n "${CARGO_TARGET_DIR:-}" ]; then
            mkdir -p target/release
            ln -sf "$CARGO_TARGET_DIR/release/bridgelab-cli" target/release/bridgelab-cli
          fi

      - name: Test - validate valid file (should exit 0)
        run: |
          ./tools/bridgelab-cli/target/release/bridgelab-cli validate tests/fixtures/hl7/adt_a01_small.hl7
          echo "BL-CLI-01 PASSED"

      - name: Test - validate invalid file (should exit 1)
        run: |
          if ./tools/bridgelab-cli/target/release/bridgelab-cli validate tests/fixtures/hl7/invalid_structure.hl7; then
            echo "BL-CLI-02 FAILED: expected non-zero exit"
            exit 1
          else
            echo "BL-CLI-02 PASSED"
          fi

      - name: Test - JSON output is valid
        run: |
          ./tools/bridgelab-cli/target/release/bridgelab-cli validate tests/fixtures/hl7/adt_a01_small.hl7 --format json | jq .
          echo "BL-CLI-03 PASSED"

      - name: Test - JUnit XML output
        run: |
          ./tools/bridgelab-cli/target/release/bridgelab-cli validate tests/fixtures/hl7/adt_a01_small.hl7 --format junit > /tmp/junit.xml
          xmllint --noout /tmp/junit.xml
          echo "BL-CLI-04 PASSED"

      - name: Test - info command shows correct metadata
        run: |
          OUTPUT=$(./tools/bridgelab-cli/target/release/bridgelab-cli info tests/fixtures/hl7/adt_a01_small.hl7 --json)
          echo "$OUTPUT" | jq -e '.[0].message_type == "ADT^A01"' > /dev/null
          echo "$OUTPUT" | jq -e '.[0].version == "2.5"' > /dev/null
          echo "BL-CLI-06/07 PASSED"

      - name: Test - anonymize removes PHI
        run: |
          ORIGINAL=$(cat tests/fixtures/hl7/adt_a01_small.hl7)
          ANON=$(./tools/bridgelab-cli/target/release/bridgelab-cli anonymize tests/fixtures/hl7/adt_a01_small.hl7)
          if echo "$ANON" | grep -q "DOE\^JOHN"; then
            echo "BL-CLI-08 FAILED: patient name not redacted"
            exit 1
          fi
          if echo "$ANON" | grep -q "REDACTED"; then
            echo "BL-CLI-08 PASSED"
          else
            echo "BL-CLI-08 FAILED: expected REDACTED in output"
            exit 1
          fi

      - name: Test - FHIR file validated with the app's engine (built-in R4 core)
        run: |
          OUT=$(./tools/bridgelab-cli/target/release/bridgelab-cli validate tests/fixtures/fhir/bundle_patient.json --format json)
          echo "$OUT" | jq -e '.[0].report.kind == "fhir"' > /dev/null
          if echo "$OUT" | grep -q "not checked"; then
            echo "BL-CLI-14 FAILED: conformance was not applied — is the built-in core loading?"
            exit 1
          fi
          echo "BL-CLI-14 PASSED"

      - name: Test - to-json conversion
        run: |
          JSON=$(./tools/bridgelab-cli/target/release/bridgelab-cli to-json tests/fixtures/hl7/adt_a01_small.hl7)
          echo "$JSON" | jq -e '.message_type == "ADT^A01"' > /dev/null
          echo "$JSON" | jq -e '.segments | length >= 5' > /dev/null
          echo "BL-CLI-10 PASSED"

      - name: Test - batch directory
        run: |
          # Batch is expected to exit non-zero because fixtures include
          # intentionally-invalid files (invalid_structure.hl7). We validate
          # that the JSON output is well-formed and contains expected fields.
          ./tools/bridgelab-cli/target/release/bridgelab-cli batch tests/fixtures/hl7 --json > /tmp/batch.json || true
          jq . /tmp/batch.json > /dev/null
          TOTAL=$(jq '.total_files' /tmp/batch.json)
          VALID=$(jq '.valid_files' /tmp/batch.json)
          FAILED=$(jq '.failed_files' /tmp/batch.json)
          if [ "$TOTAL" -lt 3 ]; then
            echo "BL-CLI-11 FAILED: expected at least 3 files, got $TOTAL"
            cat /tmp/batch.json
            exit 1
          fi
          if [ "$VALID" -lt 1 ]; then
            echo "BL-CLI-11 FAILED: expected at least 1 valid file"
            cat /tmp/batch.json
            exit 1
          fi
          echo "BL-CLI-11/12 PASSED: total=$TOTAL valid=$VALID failed=$FAILED"

      - name: Test - info across fixtures (BL-PARSER-02/03)
        run: |
          CLI=./tools/bridgelab-cli/target/release/bridgelab-cli
          # In HL7 v2.5.1+ MSH-9 is 3-component (code^event^structure, e.g.
          # "ADT^A01^ADT_A01") whereas earlier versions commonly use 2 (e.g.
          # "ADT^A01"). Prefix match keeps the assertion version-agnostic.
          check_prefix() {
            case "$1" in "$2"*) return 0 ;; *) return 1 ;; esac
          }
          for f in tests/fixtures/hl7/adt_a01_small.hl7 \
                   tests/fixtures/hl7/adt_a01_v2.5.1.hl7 \
                   tests/fixtures/hl7/orm_o01_multisegment.hl7 \
                   tests/fixtures/hl7/oru_r01_with_base64.hl7; do
            OUT=$($CLI info "$f" --json)
            TYPE=$(echo "$OUT" | jq -r '.[0].message_type')
            VER=$(echo "$OUT"  | jq -r '.[0].version')
            echo "  $f -> $TYPE v$VER"
            case "$f" in
              *adt_a01_small*)
                check_prefix "$TYPE" "ADT^A01" && [ "$VER" = "2.5" ]   || exit 1 ;;
              *adt_a01_v2.5.1*)
                check_prefix "$TYPE" "ADT^A01" && [ "$VER" = "2.5.1" ] || exit 1 ;;
              *orm_o01_multiseg*)
                check_prefix "$TYPE" "ORM^O01"                         || exit 1 ;;
              *oru_r01_with_base64*)
                check_prefix "$TYPE" "ORU^R01"                         || exit 1 ;;
            esac
          done
          echo "BL-PARSER-02/03 PASSED"

      - name: Test - parses large file with base64 section (BL-PERF-03)
        run: |
          CLI=./tools/bridgelab-cli/target/release/bridgelab-cli
          FIX=tests/fixtures/hl7/large_oru_with_base64.hl7
          # Sanity: fixture is genuinely large (>100 KB)
          SIZE=$(wc -c < "$FIX")
          if [ "$SIZE" -lt 102400 ]; then
            echo "BL-PERF-03 FAILED: fixture unexpectedly small ($SIZE bytes)"
            exit 1
          fi
          # Parser survives and exposes the payload through to-json. Find any
          # OBX-5 entry and assert it carries a multi-KB value (the base64 blob).
          JSON=$($CLI to-json "$FIX")
          MAX=$(echo "$JSON" | jq '[.segments[] | .fields | to_entries[] | .value | length] | max')
          if [ -z "$MAX" ] || [ "$MAX" = "null" ] || [ "$MAX" -lt 10000 ]; then
            echo "BL-PERF-03 FAILED: expected a >10 KB field, got max=$MAX"
            exit 1
          fi
          echo "BL-PERF-03 PASSED: fixture=$SIZE bytes, largest field=$MAX bytes"

      - name: Test - JUnit XML is well-formed across fixtures
        run: |
          CLI=./tools/bridgelab-cli/target/release/bridgelab-cli
          for f in tests/fixtures/hl7/*.hl7; do
            $CLI validate "$f" --format junit > /tmp/x.xml || true
            xmllint --noout /tmp/x.xml
          done
          echo "BL-CLI-04 (all fixtures) PASSED"

      - name: Test - anonymize preserves segment count (BL-ANON-10)
        run: |
          CLI=./tools/bridgelab-cli/target/release/bridgelab-cli
          # HL7 uses CR between segments but fixtures on disk may use LF; the
          # anonymize output writes CR to stay HL7-compliant. Normalize both
          # streams to LF before counting segment-prefix lines.
          count_segments() { tr '\r' '\n' | grep -c '^[A-Z][A-Z0-9][A-Z0-9]|' || true; }
          for f in tests/fixtures/hl7/adt_a01_small.hl7 \
                   tests/fixtures/hl7/adt_a01_v2.5.1.hl7; do
            ORIG_SEG=$(cat "$f"           | count_segments)
            ANON_SEG=$($CLI anonymize "$f" | count_segments)
            if [ "$ORIG_SEG" != "$ANON_SEG" ] || [ "$ORIG_SEG" -lt 1 ]; then
              echo "BL-ANON-10 FAILED: $f orig=$ORIG_SEG anon=$ANON_SEG"
              exit 1
            fi
            echo "  $f -> $ORIG_SEG segments preserved"
          done
          echo "BL-ANON-10 PASSED"

      - name: Test - validate missing MSH-9 detected (BL-VALID-03)
        run: |
          CLI=./tools/bridgelab-cli/target/release/bridgelab-cli
          # --format json returns [{file, report: {issues: [...]}}]
          OUT=$($CLI validate tests/fixtures/hl7/missing_msh9.hl7 --format json || true)
          echo "$OUT" | jq -e '.[0].report.issues | map(select(.rule_id | startswith("MSH"))) | length > 0' > /dev/null
          echo "BL-VALID-03 PASSED"

      - name: Test - data type checks (BL-VALID-15)
        run: |
          CLI=./tools/bridgelab-cli/target/release/bridgelab-cli
          printf 'MSH|^~\\&|A|B|C|D|2024-01-01 12:00||ORU^R01|1|P|2.5\rPID|1||1^^^H^MR||Rossi^Mario||19801399|F\rOBX|1|NM|X^Y||abc||||||F\r' > /tmp/types.hl7
          OUT=$($CLI validate /tmp/types.hl7 --format json || true)
          for r in TYPE-DTM-MSH-7 TYPE-DTM-PID-7 TYPE-NM-OBX-5; do
            echo "$OUT" | jq -e --arg r "$r" '[.[0].report.issues[].rule_id] | index($r) != null' > /dev/null || { echo "BL-VALID-15 FAILED: $r"; exit 1; }
          done
          echo "BL-VALID-15 PASSED"
      - name: Test - FHIR XML typed like JSON (BL-FHIR-XML-01)
        run: |
          CLI=./tools/bridgelab-cli/target/release/bridgelab-cli
          echo '<Patient xmlns="http://hl7.org/fhir"><id value="p1"/><active value="true"/><name><family value="Rossi"/></name><multipleBirthInteger value="2"/></Patient>' > /tmp/pat.xml
          $CLI validate /tmp/pat.xml --format json | jq -e '.[0].report.valid == true' > /dev/null
          [ "$($CLI fhirpath 'Patient.active = true' /tmp/pat.xml)" = "true" ]
          echo '<Observation xmlns="http://hl7.org/fhir"><status value="final"/><code><text value="x"/></code><valueQuantity><value value="6.30"/><unit value="mmol/L"/></valueQuantity></Observation>' > /tmp/obs.xml
          $CLI fhirpath 'Observation.value.ofType(Quantity)' /tmp/obs.xml --json | jq -e '.count == 1' > /dev/null
          echo "BL-FHIR-XML-01 PASSED"

      - name: Test - standard input (BL-CLI-19)
        run: |
          CLI=./tools/bridgelab-cli/target/release/bridgelab-cli
          cat tests/fixtures/hl7/adt_a01_small.hl7 | $CLI validate - --format json | jq -e '.[0].report.valid == true' > /dev/null
          cat tests/fixtures/fhir/bundle_patient.json | $CLI info - --json | jq -e '.[0].message_type == "Bundle"' > /dev/null
          cat tests/fixtures/hl7/adt_a01_small.hl7 | $CLI to-json - | jq -e '.message_type | startswith("ADT^A01")' > /dev/null
          echo "BL-CLI-19 PASSED"

      - name: Test - fhirpath (BL-CLI-20)
        run: |
          CLI=./tools/bridgelab-cli/target/release/bridgelab-cli
          F=tests/fixtures/fhir/bundle_patient.json
          [ "$($CLI fhirpath 'Bundle.entry.count()' $F)" -ge 1 ]
          $CLI fhirpath 'Bundle.entry.count()' $F --json | jq -e '.error == null and .count == 1' > /dev/null
          if $CLI fhirpath 'Patient.nosuch(' $F 2>/dev/null; then echo "BL-CLI-20 FAILED: bad expression exited 0"; exit 1; fi
          echo "BL-CLI-20 PASSED"

      - name: Test - xsd Community set only (BL-CLI-21)
        run: |
          CLI=./tools/bridgelab-cli/target/release/bridgelab-cli
          $CLI xsd ADT^A01 > /tmp/adt.xsd
          xmllint --noout /tmp/adt.xsd
          grep -q 'name="ADT_A01"' /tmp/adt.xsd
          if $CLI xsd SIU_S12 2>/tmp/xsd.err; then echo "BL-CLI-21 FAILED: full catalogue exported"; exit 1; fi
          grep -q "BridgeLab Pro" /tmp/xsd.err
          echo "BL-CLI-21 PASSED"

      - name: Test - send over MLLP (BL-CLI-22)
        run: |
          CLI=./tools/bridgelab-cli/target/release/bridgelab-cli
          python3 tests/tools/mllp_ack_server.py 47201 AA & sleep 1
          $CLI send tests/fixtures/hl7/adt_a01_small.hl7 --host 127.0.0.1 --port 47201 --json | jq -e '.ack_code == "AA"' > /dev/null
          wait
          python3 tests/tools/mllp_ack_server.py 47201 AE & sleep 1
          if $CLI send tests/fixtures/hl7/adt_a01_small.hl7 --host 127.0.0.1 --port 47201 > /dev/null; then echo "BL-CLI-22 FAILED: AE exited 0"; exit 1; fi
          wait
          if $CLI send tests/fixtures/hl7/adt_a01_small.hl7 --host 127.0.0.1 --port 47202 --timeout 2 2>/dev/null; then echo "BL-CLI-22 FAILED: refused exited 0"; exit 1; fi
          echo "BL-CLI-22 PASSED"

      - name: Test - run test case packs (BL-CLI-23)
        run: |
          CLI=./tools/bridgelab-cli/target/release/bridgelab-cli
          $CLI test tests/fixtures/packs/regression.bltests.json --format json | jq -e '.failed == 0 and .passed == 4' > /dev/null
          $CLI test tests/fixtures/packs/regression.bltests.json --format junit > /tmp/pack.xml
          xmllint --noout /tmp/pack.xml
          if $CLI test tests/fixtures/packs/failing.bltests.json > /tmp/fail.txt; then echo "BL-CLI-23 FAILED: failing pack exited 0"; exit 1; fi
          grep -q "expected type ORU^R01" /tmp/fail.txt
          echo "BL-CLI-23 PASSED"

      - name: Test - legacy charset files (BL-CLI-24)
        run: |
          CLI=./tools/bridgelab-cli/target/release/bridgelab-cli
          F=tests/fixtures/hl7/adt_a01_latin1.hl7
          $CLI validate $F --format json | jq -e '.[0].report.valid == true' > /dev/null
          $CLI to-json $F | jq -e '.segments[2].fields["PID-5"] == "Müller^Jörg"' > /dev/null
          $CLI anonymize $F -o /tmp/anon.hl7
          if grep -q "invalid utf8" /tmp/anon.hl7; then echo "BL-CLI-24 FAILED: segments destroyed"; exit 1; fi
          iconv -f ISO-8859-1 -t UTF-8 /tmp/anon.hl7 | grep -q "Lettò 2"
          python3 tests/tools/mllp_ack_server.py 47203 AA & sleep 1
          $CLI send $F --host 127.0.0.1 --port 47203 > /dev/null
          wait
          if $CLI send $F --host 127.0.0.1 --port 47203 --encoding FOO 2>/dev/null; then echo "BL-CLI-24 FAILED: unknown encoding accepted"; exit 1; fi
          echo "BL-CLI-24 PASSED"

      - name: Test - nothing silently skipped (BL-CLI-25)
        run: |
          CLI=./tools/bridgelab-cli/target/release/bridgelab-cli
          if $CLI validate tests/fixtures/hl7/adt_a01_small.hl7 tests/fixtures/hl7/DOES_NOT_EXIST.hl7 > /tmp/v.txt 2>/dev/null; then echo "BL-CLI-25 FAILED: missing path exited 0"; exit 1; fi
          grep -q "NOT FOUND" /tmp/v.txt
          $CLI validate tests/fixtures/hl7/adt_a01_small.hl7 missing.hl7 --format junit 2>/dev/null > /tmp/v.xml || true
          xmllint --noout /tmp/v.xml
          grep -q 'classname="INPUT"' /tmp/v.xml
          if $CLI test tests/fixtures/packs/regression.bltests.json missing.bltests.json > /dev/null 2>&1; then echo "BL-CLI-25 FAILED: missing pack exited 0"; exit 1; fi
          set +e; $CLI test missing.bltests.json > /dev/null 2>&1; RC=$?; set -e
          [ "$RC" = 1 ] || { echo "BL-CLI-25 FAILED: missing pack alone exited $RC"; exit 1; }
          mkdir -p /tmp/bl-batch/sub /tmp/bl-empty
          cp tests/fixtures/hl7/missing_msh9.hl7 /tmp/bl-batch/sub/BAD.HL7
          $CLI batch /tmp/bl-batch --extension .hl7 --json > /tmp/b.json || true
          jq -e '.total_files == 1 and (.results[0].issues | length) > 0' /tmp/b.json > /dev/null
          if $CLI batch /tmp/bl-empty > /dev/null 2>&1; then echo "BL-CLI-25 FAILED: empty folder exited 0"; exit 1; fi
          echo '{"format":"bridgelab-test-cases","format_version":1,"test_cases":[]}' > /tmp/empty.bltests.json
          if $CLI test /tmp/empty.bltests.json > /dev/null 2>&1; then echo "BL-CLI-25 FAILED: empty pack exited 0"; exit 1; fi
          echo "BL-CLI-25 PASSED"

      - name: Test - not checked is not a pass (BL-CLI-26)
        run: |
          CLI=./tools/bridgelab-cli/target/release/bridgelab-cli
          $CLI validate tests/fixtures/fhir/patient_simple.json --no-plugins --fhir-packages /nonexistent --format junit 2> /tmp/pk.err > /tmp/pk.xml
          grep -q "fhir-packages /nonexistent" /tmp/pk.err
          xmllint --noout /tmp/pk.xml
          grep -q "<skipped" /tmp/pk.xml
          echo '{"name":"not-fhir"}' > /tmp/package.json
          $CLI validate /tmp/package.json > /tmp/pj.txt || true
          grep -q "Not a FHIR resource" /tmp/pj.txt
          printf '{"resourceType":"Patient","id":"x","gender":"bo\\u0007gus"}' > /tmp/ctl.json
          $CLI validate /tmp/ctl.json --format junit > /tmp/ctl.xml || true
          xmllint --noout /tmp/ctl.xml
          echo "BL-CLI-26 PASSED"

      - name: Test - expected type components and versions (BL-CLI-23b, BL-VALID-17)
        run: |
          CLI=./tools/bridgelab-cli/target/release/bridgelab-cli
          printf '{"format":"bridgelab-test-cases","format_version":1,"test_cases":[{"name":"three components","content":"MSH|^~\\\\&|A|B|C|D|20240101||ADT^A01^ADT_A01|1|P|2.5\\rEVN|A01|20240101\\rPID|1||1^^^H^MR||Rossi^Mario||19800101|M\\rPV1|1|I\\r","expected_message_type":"ADT^A01"}]}' > /tmp/t3.bltests.json
          $CLI test /tmp/t3.bltests.json --no-plugins --format json | jq -e '.passed == 1' > /dev/null
          printf 'MSH|^~\\&|A|B|C|D|20240101||ADT^A01|1|P|2.8\rPID|1||1^^^H^MR||Rossi^Mario||19800101|M\r' > /tmp/v28.hl7
          $CLI validate /tmp/v28.hl7 --no-plugins --format json | jq -e '[.[0].report.issues[].rule_id] | index("MSH-005") != null' > /dev/null
          echo "BL-CLI-23b/BL-VALID-17 PASSED"

      - name: Test - multi-message send and MSA-2 (BL-CLI-27)
        run: |
          CLI=./tools/bridgelab-cli/target/release/bridgelab-cli
          printf 'MSH|^~\\&|A|B|C|D|20240101||ADT^A01|M1|P|2.5\nPID|1||1\nMSH|^~\\&|A|B|C|D|20240101||ADT^A01|M2|P|2.5\nPID|1||2\n' > /tmp/two.hl7
          python3 tests/tools/mllp_ack_server.py 47204 AA 2 > /tmp/srv.out & sleep 1
          $CLI send /tmp/two.hl7 --host 127.0.0.1 --port 47204 --json | jq -e '.ack_code == "AA" and (.results | length) == 2' > /dev/null
          wait
          grep -q "received=2" /tmp/srv.out
          python3 tests/tools/mllp_ack_server.py 47205 AA 1 OTHER-999 > /dev/null & sleep 1
          if $CLI send tests/fixtures/hl7/adt_a01_small.hl7 --host 127.0.0.1 --port 47205 > /dev/null 2>&1; then echo "BL-CLI-27 FAILED: ACK for another message accepted"; exit 1; fi
          wait
          echo "BL-CLI-27 PASSED"

  fhir-fixture-tests:
    name: FHIR Fixture Tests
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v5

      - name: Install jq
        run: |
          # Already installed (a self-hosted runner prepared once) → no sudo needed.
          PKGS="jq"
          # dpkg -s also succeeds for removed-but-not-purged packages, so
          # require the exact status of an installed package for each one.
          missing=0
          for p in $PKGS; do
            dpkg-query -W -f='${Status}' "$p" 2>/dev/null | grep -qx 'install ok installed' || missing=1
          done
          if [ "$missing" = 0 ]; then
            echo "System packages already installed: $PKGS"
          else
            sudo apt-get update
            sudo apt-get install -y $PKGS
          fi

      - name: Validate FHIR fixtures parse as JSON (BL-FHIR-01)
        run: |
          for f in tests/fixtures/fhir/*.json; do
            jq -e '.resourceType' "$f" > /dev/null
            echo "  $f -> $(jq -r '.resourceType' "$f")"
          done
          echo "BL-FHIR-01 (fixtures) PASSED"

      - name: Detect Bundle vs single resource (BL-BUNDLE-02)
        run: |
          for f in tests/fixtures/fhir/bundle_*.json; do
            TYPE=$(jq -r '.resourceType' "$f")
            ENTRIES=$(jq -r '.entry | length' "$f")
            [ "$TYPE" = "Bundle" ] || { echo "Expected Bundle in $f"; exit 1; }
            [ "$ENTRIES" -gt 0 ]  || { echo "Bundle $f has no entries"; exit 1; }
            echo "  $f -> $ENTRIES entries"
          done
          echo "BL-BUNDLE-02 (fixtures) PASSED"

      - name: Detect dangling references (BL-BUNDLE-06)
        run: |
          # Collect all entry.fullUrl + entry.resource.id, then check references
          F=tests/fixtures/fhir/dangling_bundle.json
          jq '.' "$F" > /dev/null
          HAS_REFS=$(jq -r '[.. | objects | .reference? // empty] | length' "$F")
          [ "$HAS_REFS" -gt 0 ] || { echo "Expected references in $F"; exit 1; }
          echo "BL-BUNDLE-06 fixture intact ($HAS_REFS refs)"

  rust-feature-tests:
    name: Rust Core Feature Tests
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          # Already installed (a self-hosted runner prepared once) → no sudo needed.
          PKGS="libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev build-essential"
          # dpkg -s also succeeds for removed-but-not-purged packages, so
          # require the exact status of an installed package for each one.
          missing=0
          for p in $PKGS; do
            dpkg-query -W -f='${Status}' "$p" 2>/dev/null | grep -qx 'install ok installed' || missing=1
          done
          if [ "$missing" = 0 ]; then
            echo "System packages already installed: $PKGS"
          else
            sudo apt-get update
            sudo apt-get install -y $PKGS
          fi

      - name: Cache cargo
        if: ${{ vars.CI_RUNNER == '' }}
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-feat-${{ hashFiles('src-tauri/Cargo.lock') }}

      # Self-hosted runner (CI_RUNNER set): no cache round-trip to GitHub —
      # the upload over the office line costs more than it saves. Build
      # output lives on the runner's own disk, outside the work folder so
      # checkout does not wipe it; ~/.cargo already persists there. One
      # directory per workspace: jobs building the same crate reuse it, and
      # cargo's lock serialises concurrent runner instances safely.
      - name: Keep build output on the runner's disk (self-hosted)
        if: ${{ vars.CI_RUNNER != '' }}
        run: echo "CARGO_TARGET_DIR=$HOME/.cache/bridgelab-ci/src-tauri" >> "$GITHUB_ENV"

      - name: Run full test suite
        working-directory: src-tauri
        run: cargo test --all -- --nocapture

      - name: Schema lookup tests (BL-INSP-05 backend)
        working-directory: src-tauri
        run: |
          # Re-run only the HL7 tables tests with output for traceability
          cargo test --all parser::hl7::tables -- --nocapture

      - name: MLLP + HTTP roundtrip tests (BL-MLLP-04/05/09/10, BL-HTTP-01/02)
        working-directory: src-tauri
        run: |
          cargo test --all communication:: -- --nocapture
