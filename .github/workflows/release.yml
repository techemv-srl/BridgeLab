name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Create or update release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: BridgeLab ${{ steps.tag.outputs.version }}
          draft: true
          prerelease: false
          body: |
            ## BridgeLab ${{ steps.tag.outputs.version }}

            HL7/FHIR editor for healthcare integration professionals.

            ### Downloads
            See the assets below for installers for Windows, macOS, and Linux.

  build-app:
    name: Build ${{ matrix.platform.name }}
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS-ARM
            os: macos-14
            target: aarch64-apple-darwin
          - name: macOS-Intel
            # macos-13 was the last Intel hosted runner. GitHub deprecated
            # it on 2024-12-04 and removed it on 2025-12-01 — any job
            # pinned to macos-13 now hangs in "Queued" forever with no
            # runner to pick it up. We cross-compile to x86_64 from an
            # Apple Silicon runner: the Rust toolchain installs the
            # target (matrix.platform.target) and Tauri picks it up via
            # --target on the build command.
            os: macos-14
            target: x86_64-apple-darwin
          - name: Windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ needs.create-release.outputs.tag }}
          fetch-depth: 0

      - name: Install system dependencies (Linux)
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev \
            librsvg2-dev libayatana-appindicator3-dev build-essential

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # macOS Developer ID signing + notarization. The Apple env vars are
      # exported ONLY when the corresponding secrets are non-empty: putting
      # them (even empty) in the tauri-action env block makes the Tauri
      # bundler treat the mere PRESENCE of APPLE_CERTIFICATE as "signing
      # requested" and fail importing an empty certificate
      # (SecKeychainItemImport: parameters not valid). Until the Apple
      # Developer enrollment is completed and the six secrets are
      # configured, this step exports nothing and builds stay unsigned.
      - name: Enable macOS signing when secrets are configured
        if: startsWith(matrix.platform.os, 'macos')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          export_var() {
            { echo "$1<<__APPLE_EOF__"; echo "${!1}"; echo "__APPLE_EOF__"; } >> "$GITHUB_ENV"
          }
          # Groups are exported atomically: a partial set (e.g. certificate
          # without its password) would trigger the signing path and fail,
          # instead of falling back to an unsigned build.
          sign_ok=1
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
            [ -n "${!v}" ] || sign_ok=0
          done
          notar_ok=1
          for v in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || notar_ok=0
          done
          if [ "$sign_ok" = 1 ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do export_var "$v"; done
            if [ "$notar_ok" = 1 ]; then
              for v in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do export_var "$v"; done
              echo "macOS signing + notarization: ENABLED"
            else
              echo "::warning::macOS signing ENABLED but notarization secrets incomplete (need APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID) - building signed, NOT notarized"
            fi
          elif [ -n "$APPLE_CERTIFICATE$APPLE_CERTIFICATE_PASSWORD$APPLE_SIGNING_IDENTITY$APPLE_ID$APPLE_PASSWORD$APPLE_TEAM_ID" ]; then
            echo "::warning::Apple signing secrets INCOMPLETE (need APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY) - building UNSIGNED"
          else
            echo "macOS signing: disabled (no Apple secrets configured) - building unsigned"
          fi

      # No updater artifacts: tauri.conf.json says so, the setting is
      # repeated on the command line (a --config overlay wins over the
      # file), the action is told not to build a latest.json, and the
      # updater signing key is kept out of the build. The in-app "Check for
      # updates" compares against the latest GitHub release and needs none
      # of this. The macOS .app.tar.gz assets are NOT updater bundles: the
      # action tars the .app directory itself and uploads it, with no input
      # to turn that off, so publish-release deletes them.
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: false
          args: --target ${{ matrix.platform.target }} --config '{"bundle":{"createUpdaterArtifacts":false}}'

      # The CLI is the same validators without the desktop shell; it builds
      # on the headless core, so no WebKit is involved, and ships beside the
      # installers as bridgelab-cli-<target>.
      - name: Build CLI
        shell: bash
        run: |
          cargo build --release --manifest-path tools/bridgelab-cli/Cargo.toml --target ${{ matrix.platform.target }}
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp tools/bridgelab-cli/target/${{ matrix.platform.target }}/release/bridgelab-cli.exe dist/bridgelab-cli-${{ matrix.platform.target }}.exe
          else
            cp tools/bridgelab-cli/target/${{ matrix.platform.target }}/release/bridgelab-cli dist/bridgelab-cli-${{ matrix.platform.target }}
          fi

      - name: Attach CLI to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          draft: true
          files: dist/bridgelab-cli-*

  publish-release:
    name: Publish Release
    needs: [create-release, build-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # tauri-action uploads every macOS .app as <name>_<arch>.app.tar.gz;
      # the .dmg is the macOS download, so drop them before publishing.
      - name: Remove macOS .app.tar.gz assets
        uses: actions/github-script@v8
        with:
          script: |
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              per_page: 100,
            });
            for (const a of assets.filter((a) => /\.app\.tar\.gz(\.sig)?$/.test(a.name))) {
              core.info(`Deleting ${a.name}`);
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner, repo: context.repo.repo, asset_id: a.id,
              });
            }

      - name: Publish release
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false
            })

  prune-old-assets:
    # After a successful publish, delete the BINARIES of older releases so
    # only the newest KEEP_RELEASES stay downloadable — old builds carry old
    # bugs. Releases, notes and tags are kept (history stays browsable);
    # only their assets are removed. Source-code archives are generated from
    # tags and are unaffected.
    name: Prune old release binaries
    needs: [create-release, publish-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEEP_RELEASES: '2'
    steps:
      - name: Delete assets of older releases
        uses: actions/github-script@v8
        with:
          script: |
            const keep = parseInt(process.env.KEEP_RELEASES || '2', 10);
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            });
            const published = releases
              .filter((r) => !r.draft && !r.prerelease)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const stale = published.slice(keep);
            for (const rel of stale) {
              for (const asset of rel.assets) {
                core.info(`Deleting ${rel.tag_name} asset: ${asset.name}`);
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner, repo: context.repo.repo, asset_id: asset.id,
                });
              }
            }
            core.info(`Binaries kept for: ${published.slice(0, keep).map(r => r.tag_name).join(', ') || 'none'}`);
