name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

# Runner: GitHub-hosted by default. A repository that sets the Actions
# variable CI_RUNNER (Settings → Secrets and variables → Actions →
# Variables) runs these jobs there instead — the private repo points it at
# its self-hosted runner, e.g. ["self-hosted","linux","x64"], so CI does not
# consume hosted minutes. The public mirror leaves it unset: self-hosted
# runners must never execute jobs a public repository's pull requests can
# trigger.
jobs:
  test-rust:
    name: Test Rust backend
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          # Already installed (a self-hosted runner prepared once) → no sudo needed.
          PKGS="libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev build-essential"
          # dpkg -s also succeeds for removed-but-not-purged packages, so
          # require the exact status of an installed package for each one.
          missing=0
          for p in $PKGS; do
            dpkg-query -W -f='${Status}' "$p" 2>/dev/null | grep -qx 'install ok installed' || missing=1
          done
          if [ "$missing" = 0 ]; then
            echo "System packages already installed: $PKGS"
          else
            sudo apt-get update
            sudo apt-get install -y $PKGS
          fi

      - name: Cache cargo
        if: ${{ vars.CI_RUNNER == '' }}
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      # Self-hosted runner (CI_RUNNER set): no cache round-trip to GitHub —
      # the upload over the office line costs more than it saves. Build
      # output lives on the runner's own disk, outside the work folder so
      # checkout does not wipe it; ~/.cargo already persists there. One
      # directory per workspace: jobs building the same crate reuse it, and
      # cargo's lock serialises concurrent runner instances safely.
      - name: Keep build output on the runner's disk (self-hosted)
        if: ${{ vars.CI_RUNNER != '' }}
        run: echo "CARGO_TARGET_DIR=$HOME/.cache/bridgelab-ci/src-tauri" >> "$GITHUB_ENV"

      - name: Run cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --all

  test-frontend:
    name: Test frontend
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync SvelteKit types
        run: pnpm exec svelte-kit sync

      - name: Svelte check (0 errors required, warnings allowed)
        run: pnpm exec svelte-check --threshold error --output human

      - name: Unit tests (Vitest)
        run: pnpm test

      - name: Build frontend
        run: pnpm build
